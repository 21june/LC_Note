org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# audio_session still applies the Kotlin Android plugin, so this project uses
# the compatibility mode until all audio dependencies support Built-in Kotlin.
android.builtInKotlin=false
# Plugin sources live in the Pub cache on C: while this project is on D:.
# Kotlin incremental caches cannot relativize paths across Windows drives.
kotlin.incremental=false
